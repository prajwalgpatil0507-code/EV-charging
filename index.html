<!DOCTYPE html>
<html>
<head>
    <title>EV Charging Station</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 20px;
            margin: auto;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #otp {
            margin-top: 20px;
            font-size: 24px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>EV Charging Station</h1>

    <p>Scan QR → Pay → Get OTP</p>

    <button onclick="payNow()">Pay Now</button>

    <div id="otp"></div>
</div>

<script>
function payNow() {
    alert("Payment Successful!");

    let otp = Math.floor(100000 + Math.random() * 900000);

    document.getElementById("otp").innerHTML =
        "Your OTP: " + otp;
}
</script>

</body>
</html>
